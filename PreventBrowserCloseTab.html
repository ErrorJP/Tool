<!doctype html>
<html lang="ja">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Protection Mode</title>
        <style>
            body,
            html {
                margin: 0;
                padding: 0;
                width: 100%;
                height: 100%;
                overflow: hidden;
                background: radial-gradient(
                    circle at center,
                    #2b2b2b 0%,
                    #1a1a1a 100%
                );
                font-family: -apple-system, BlinkMacSystemFont, "Segoe UI",
                    Roboto, "Helvetica Neue", Arial, sans-serif;
                color: #ffffff;
                display: flex;
                flex-direction: column;
                justify-content: center;
                align-items: center;
            }

            .container {
                text-align: center;
                padding: 40px;
                max-width: 600px;
                z-index: 10;
            }

            h1 {
                font-weight: 200;
                font-size: 32px;
                letter-spacing: 4px;
                margin-bottom: 20px;
                color: #f0f0f0;
                text-transform: uppercase;
            }

            p {
                font-weight: 300;
                font-size: 14px;
                line-height: 2;
                color: #888888;
                margin-bottom: 50px;
                letter-spacing: 1px;
            }

            .btn {
                display: inline-block;
                padding: 15px 50px;
                border: 1px solid rgba(255, 255, 255, 0.3);
                text-decoration: none;
                font-size: 13px;
                letter-spacing: 2px;
                transition: all 0.4s ease;
                cursor: pointer;
            }

            .btn:hover {
                border-color: #ffffff;
                color: #ffffff;
                background: rgba(255, 255, 255, 0.05);
            }

            .btn.active {
                border-color: #c5a059;
                color: #c5a059;
                cursor: default;
            }

            .horizon-line {
                position: absolute;
                bottom: 100px;
                left: 50%;
                transform: translateX(-50%);
                width: 1px;
                height: 60px;
                background: linear-gradient(
                    to bottom,
                    rgba(255, 255, 255, 0),
                    rgba(255, 255, 255, 0.3)
                );
            }
            .footer-note {
                position: absolute;
                bottom: 30px;
                font-size: 10px;
                color: #333;
                letter-spacing: 2px;
                text-transform: uppercase;
            }
        </style>
    </head>
    <body>
        <div class="container">
            <h1>Stay Focused</h1>

            <p id="status-text">
                このタブを開くことで、ブラウザを誤って閉じることを防ぎます。<br />
                Secure your session by keeping this tab open.
            </p>

            <a class="btn" id="js-btn" onclick="activate()">
                ACTIVATE PROTECTION
            </a>
        </div>

        <div class="horizon-line"></div>
        <div class="footer-note">System Idle • Monitoring</div>

        <script>
            function activate() {
                window.onbeforeunload = function (e) {
                    e = e || window.event;
                    if (e) {
                        e.returnValue = "Sure?";
                    }
                    return "Sure?";
                };

                var btn = document.getElementById("js-btn");
                var text = document.getElementById("status-text");

                btn.innerHTML = "PROTECTION ACTIVE";
                btn.classList.add("active");

                text.style.color = "#444";
                text.innerHTML =
                    "Protection is running in background.<br>You are safe now.";
            }
        </script>
    </body>
</html>
